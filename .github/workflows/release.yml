name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The backend's fe.sh downloads n9e-fe-<tag>.tar.gz, so the archive is named
      # after the tag. package.json must carry the same version because the UI
      # version page reads it; fail fast instead of shipping a mismatched build.
      - name: Check package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($GITHUB_REF_NAME); bump package.json and package-lock.json before tagging"
            exit 1
          fi
          echo "ARCHIVE=n9e-fe-${GITHUB_REF_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.15.0
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Package files to tar.gz
        run: tar -czf "$ARCHIVE" pub

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-output-tar-gz
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --title "$GITHUB_REF_NAME" --generate-notes
          fi
